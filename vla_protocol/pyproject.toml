[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-protocol"
version = "0.1.0"
description = "Versioned, hardware-independent IDC VLA exchange contracts"
requires-python = ">=3.10"
dependencies = ["pydantic==2.10.6"]

[tool.setuptools.packages.find]
where = ["src"]
